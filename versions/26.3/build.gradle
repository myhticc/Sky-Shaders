plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '1.1.0+26.3'
group = 'dev.x1eqn.skyshaders'
base { archivesName = 'sky-shaders' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.164.0+26.3'
    compileOnly 'com.terraformersmc:modmenu:21.0.0'
    runtimeOnly 'com.terraformersmc:modmenu:21.0.0'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.named('jar') { from('LICENSE_x1eqn') }
